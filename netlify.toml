[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Client-side routing: every non-asset path serves index.html, React Router takes it.
# Netlify processes /.netlify/functions/* automatically before this rule applies.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
